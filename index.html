<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>StatsHunters Grid</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="map"></div>
<div class="panel">
  <button id="follow" class="active">⦿ Follow GPS</button>
  <div id="status">GPS: waiting…</div>
  <hr>
  <div id="sh-form">
    <input id="sh-token" type="text" placeholder="StatsHunters API token" autocomplete="off" spellcheck="false">
    <button id="sh-sync">⬇ Sync tiles</button>
  </div>
  <div id="sh-saved" class="hidden">
    <button id="sh-reload" class="link">reload</button>
    <button id="sh-change" class="link">change</button>
  </div>
  <div id="sh-status">Tiles: —</div>
</div>
<div class="attribution">© OpenStreetMap contributors</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
