<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>StatsHunters Grid</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="map"></div>
<div class="panel">
  <button id="follow" class="active">⦿ Follow GPS</button>
  <div id="status">GPS: waiting…</div>
  <hr>
  <button id="reload-btn">↻ Reload tiles</button>
  <button id="settings-btn">⚙ Settings</button>
</div>

<div id="settings-overlay" class="hidden">
  <div id="settings-modal">
    <h3>Settings</h3>

    <label>StatsHunters API token</label>
    <div id="sh-form">
      <input id="sh-token" type="text" placeholder="StatsHunters API token" autocomplete="off" spellcheck="false">
      <button id="sh-sync">⬇ Sync tiles</button>
    </div>
    <div id="sh-saved" class="hidden">
      <button id="sh-change" class="link">change</button>
    </div>
    <div id="sh-status">Tiles: —</div>

    <hr>

    <label for="zoom-setting">Grid & tiles visible from zoom</label>
    <input id="zoom-setting" type="number" min="1" max="19" step="1">

    <button id="settings-close">Close</button>
  </div>
</div>

<div class="attribution">© OpenStreetMap contributors</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
